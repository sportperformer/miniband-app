<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Band">
<title>Mini Band — rejestr nagrań</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sticky-header">
<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="20" rx="16" ry="8" fill="none" stroke="var(--accent)" stroke-width="4"/>
        <circle cx="20" cy="12" r="2.6" fill="var(--accent)"/>
      </svg>
      <div class="brand-text">
        <h1>Mini Band</h1>
        <p>rejestr nagrań</p>
      </div>
    </div>
    <div class="progress-loop" id="progressLoop">
      <svg viewBox="0 0 130 64" class="loop-svg">
        <ellipse class="loop-track" cx="65" cy="32" rx="56" ry="26"></ellipse>
        <ellipse class="loop-fill" id="loopFillEl" cx="65" cy="32" rx="56" ry="26"></ellipse>
      </svg>
      <div class="progress-label">
        <strong id="progressCount">0 / 0</strong>
        <span>nagrane</span>
      </div>
    </div>
  </div>
</header>

<div class="filters">
  <input type="search" id="searchInput" class="search-input" placeholder="Szukaj ćwiczenia…" autocomplete="off">

  <div class="chip-row" data-group="partia" id="partiaChips">
    <button class="chip is-active" data-value="all">Cały plan</button>
  </div>

  <div class="chip-row" data-group="miejsce" id="miejsceChips">
    <button class="chip is-active" data-value="all">Wszędzie</button>
  </div>

  <div class="chip-row" data-group="status">
    <button class="chip is-active" data-value="all">Wszystkie</button>
    <button class="chip" data-value="todo">Do nagrania</button>
    <button class="chip" data-value="done">Nagrane</button>
  </div>
</div>
</div>

<main id="list" class="list" aria-live="polite"></main>

<p id="emptyState" class="empty-state" hidden>Brak ćwiczeń spełniających wybrane filtry.</p>

<footer class="footer">
  <button id="exportBtn" class="text-btn">Eksportuj postęp</button>
  <label class="text-btn file-label">
    Importuj postęp
    <input type="file" id="importInput" accept="application/json" hidden>
  </label>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
